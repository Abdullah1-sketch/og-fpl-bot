name: FPL Diagnostic - No Posting

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpl-diagnostic-only
  cancel-in-progress: false

jobs:
  inspect-public-fpl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public FPL data (no bot, no secrets)
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen, build_opener, HTTPRedirectHandler
          from urllib.parse import urljoin, urlparse
          from urllib.error import HTTPError

          ROOT = 'https://fantasy.premierleague.com'
          out = Path('fpl-diagnostic-output')
          out.mkdir(exist_ok=True)
          report = {'checked_at': datetime.now(ZoneInfo('UTC')).isoformat(),
                    'requests': [], 'notes': [
                        'Read-only public snapshots. No X or OpenAI calls; no bot/state access.',
                        'A successful HTTP response does not prove a live goal or assist was observed.',
                        'Player totals do not prove which assist belongs to which goal.',
                        'Frontend JavaScript is downloaded as text only; never executed.'
                    ]}

          class SameHostRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if urlparse(newurl).hostname != urlparse(ROOT).hostname:
                      raise ValueError('Cross-host redirect refused')
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          opener = build_opener(SameHostRedirect())

          def fetch(path, filename, as_json=False):
              url = urljoin(ROOT, path)
              meta = {'file': filename, 'url': url}
              report['requests'].append(meta)
              try:
                  req = Request(url, headers={'User-Agent': 'OG-FPL-read-only-diagnostic/1.0',
                                             'Accept': 'application/json' if as_json else '*/*'})
                  start = time.monotonic()
                  with opener.open(req, timeout=12) as response:
                      data = response.read(12_000_001)
                      meta.update(status=response.status,
                                  content_type=response.headers.get('Content-Type'),
                                  seconds=round(time.monotonic()-start, 3))
                  if len(data) > 12_000_000:
                      raise ValueError('Response exceeds diagnostic size limit')
                  text = data.decode('utf-8', errors='replace')
                  (out / filename).write_text(text, encoding='utf-8')
                  value = json.loads(text) if as_json else text
                  meta['parsed'] = True
                  print(filename, 'OK', meta['status'])
                  return value
              except HTTPError as exc:
                  meta.update(status=exc.code, error=str(exc))
              except Exception as exc:
                  meta['error'] = str(exc)
              print(filename, 'FAILED', meta.get('error'))
              return None

          bootstrap = fetch('/api/bootstrap-static/', 'bootstrap.json', True)
          fixtures = fetch('/api/fixtures/', 'fixtures.json', True)
          page = fetch('/ar/price-changes', 'price-changes.html')
          today = datetime.now(ZoneInfo('Asia/Riyadh')).date()
          teams = {}
          gws = set()
          if isinstance(bootstrap, dict):
              teams = {t['id']: t.get('name') for t in bootstrap.get('teams', [])}
              for event in bootstrap.get('events', []):
                  if event.get('is_current') or event.get('is_next'):
                      if isinstance(event.get('id'), int):
                          gws.add(event['id'])
              report['price_field_samples'] = [
                  {k: v for k, v in p.items() if k in ('id', 'web_name') or
                   any(term in k.lower() for term in ('price', 'projection', 'likelihood'))}
                  for p in bootstrap.get('elements', [])[:20]
              ]
          report['today_ksa'] = str(today)
          report['today_fixtures'] = []
          if isinstance(fixtures, list):
              for fixture in fixtures:
                  try:
                      kickoff = datetime.fromisoformat(fixture['kickoff_time'].replace('Z', '+00:00'))
                      local = kickoff.astimezone(ZoneInfo('Asia/Riyadh'))
                  except (KeyError, TypeError, ValueError):
                      continue
                  if local.date() == today:
                      report['today_fixtures'].append({
                          'id': fixture.get('id'), 'event': fixture.get('event'),
                          'home': teams.get(fixture.get('team_h'), fixture.get('team_h')),
                          'away': teams.get(fixture.get('team_a'), fixture.get('team_a')),
                          'kickoff_ksa': local.isoformat(),
                          'started': fixture.get('started'), 'finished': fixture.get('finished'),
                          'finished_provisional': fixture.get('finished_provisional'),
                          'stats': fixture.get('stats')})
                      if isinstance(fixture.get('event'), int):
                          gws.add(fixture['event'])
          for gw in sorted(gws)[:3]:
              live = fetch(f'/api/event/{gw}/live/', f'live-gw-{gw}.json', True)
              if isinstance(live, dict):
                  elements = live.get('elements', [])
                  report.setdefault('live_samples', {})[str(gw)] = {
                      'players': len(elements),
                      'examples': [p for p in elements if p.get('stats', {}).get('goals_scored')
                                   or p.get('stats', {}).get('assists')][:8] or elements[:2]}

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'script' and attrs.get('src'):
                      url = urljoin(ROOT, attrs['src'])
                      if urlparse(url).hostname == urlparse(ROOT).hostname:
                          self.urls.append(url)

          if isinstance(page, str):
              parser = Scripts()
              parser.feed(page)
              scripts = list(dict.fromkeys(parser.urls))
              report['frontend_scripts_found'] = scripts
              for i, url in enumerate(scripts[:6]):
                  js = fetch(url, f'frontend-{i}.js')
                  if not isinstance(js, str):
                      continue
                  pattern = r'price_change|priceChange|projected_percent|Very Likely|Likely to|Unlikely to'
                  hits = list(re.finditer(pattern, js, re.I))
                  report.setdefault('price_code_excerpts', []).append({
                      'url': url, 'matches': len(hits),
                      'excerpts': [js[max(0, m.start()-250):m.end()+400] for m in hits[:30]]})
          report['failed_requests'] = sum('error' in r for r in report['requests'])
          (out / 'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print('KSA date:', today)
          for fixture in report['today_fixtures']:
              print(fixture['kickoff_ksa'], fixture['home'], 'vs', fixture['away'])
          print('Failed requests:', report['failed_requests'])
          print('Download fpl-diagnostic-report from this run. No tweets were sent.')
          # Preserve diagnostics even when some endpoints are unavailable.
          PY

      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-diagnostic-report
          path: fpl-diagnostic-output/
          if-no-files-found: error
          retention-days: 3
