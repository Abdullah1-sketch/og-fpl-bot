name: OG FPL Bot

on:
  schedule:
    - cron: "*/15 * * * *"
    # Extra fast-price starts. bot.py checks Europe/London time and only one
    # of these runs is active, depending on UK daylight-saving time.
    - cron: "55 22 * * *"
    - cron: "55 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: og-fpl-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Get files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run OG FPL Bot
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY_RUN: "false"
          RUN_TRIGGER: ${{ github.event.schedule }}
        run: python bot.py

      - name: Save bot state
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- state.json; then
            echo "No state changes"
            exit 0
          fi

          # Preserve the state created by this run.
          cp state.json /tmp/og-fpl-state.json

          git config user.name "og-fpl-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Retry a few times in case main changes while this run is finishing.
          for attempt in 1 2 3; do
            echo "State save attempt ${attempt}/3"

            git fetch origin main
            git reset --hard origin/main
            cp /tmp/og-fpl-state.json state.json

            if git diff --quiet -- state.json; then
              echo "State already current"
              exit 0
            fi

            git add state.json
            git commit -m "Update bot state"

            if git push origin HEAD:main; then
              echo "State saved successfully"
              exit 0
            fi

            echo "Push was rejected; refreshing main and retrying..."
            sleep 2
          done

          echo "Failed to save state after 3 attempts"
          exit 1
